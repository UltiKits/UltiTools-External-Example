name: Maven CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Test & package (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['25']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Verify
        # verify runs the tests, packages the JAR and writes a coverage report without a gate.
        # -U: this build depends on UltiTools-API 7.0.0-SNAPSHOT, and the restored Maven cache can hold
        # an older snapshot that Maven would otherwise not re-check until the next day.
        run: mvn -B -U verify
